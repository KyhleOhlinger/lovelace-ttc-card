name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get tag version
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: TTC Transit Card ${{ steps.tag.outputs.version }}
          draft: false
          prerelease: false
          files: |
            dist/ttc-card.js
          generate_release_notes: true
          body: |
            ## TTC Transit Card ${{ steps.tag.outputs.version }}

            ### Installation
            Install via HACS by adding `https://github.com/KyhleOhlinger/lovelace-ttc-card`
            as a custom repository (category: Dashboard), or update automatically if already installed.

            ### Files
            - `ttc-card.js` — the Lovelace card
