name: Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: HACS Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate HACS
        uses: hacs/action@main
        with:
          category: plugin

      - name: Check dist file exists
        run: |
          if [ ! -f "dist/ttc-card.js" ]; then
            echo "ERROR: dist/ttc-card.js not found"
            exit 1
          fi
          echo "dist/ttc-card.js found ($(wc -c < dist/ttc-card.js) bytes)"

      - name: Check hacs.json
        run: |
          if [ ! -f "hacs.json" ]; then
            echo "ERROR: hacs.json not found"
            exit 1
          fi
          python3 -c "import json; f=open('hacs.json'); json.load(f); print('hacs.json is valid JSON')"
